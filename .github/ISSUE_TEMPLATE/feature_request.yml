name: Feature request
description: Something nextship should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you would expect nextship to handle it.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
