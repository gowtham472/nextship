# Publishes nextship to npm with provenance.
#
# Publishing happens here rather than from a laptop so npm can attest where the
# tarball came from. Provenance signs a statement linking the published bytes to
# this repository, this workflow and the exact commit, which anyone can verify on
# the package page.
#
# That matters more for this package than for most. nextship asks people for a
# cloud token and builds their source, so "the code you audited is the code you
# installed" is a claim worth being able to prove rather than assert.
#
# Authentication happens in two phases, because npm cannot publish a package for
# the first time over OIDC: a trusted publisher is configured in a package's
# settings, and those settings do not exist until the package does.
# See https://github.com/npm/cli/issues/8544.
#
#   Phase 1, once: NPM_TOKEN, an npm automation token. Automation tokens bypass
#   the 2FA prompt, which interactive tokens cannot do from CI.
#
#   Phase 2, every release after: configure this repository and this workflow
#   filename as a trusted publisher on npmjs.com, then delete NPM_TOKEN. The npm
#   CLI detects the OIDC token automatically and prefers it, so nothing here
#   changes. A deleted secret makes NODE_AUTH_TOKEN empty and unused rather than
#   breaking the job.
#
# Deleting the token is the point of the exercise. A long-lived credential with
# publish rights on an infrastructure package is exactly the thing worth not
# having.
#
# Author: Gowtham
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Pack and verify without publishing'
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Provenance is signed with a short-lived OIDC token, so this is what makes
      # the attestation possible at all.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, which has no OIDC support at all. Trusted
      # publishing needs 11.5.1 or newer, so the upgrade is what makes phase 2
      # possible rather than an optimisation.
      - run: npm i -g npm@latest corepack@latest && corepack enable

      - name: Record the toolchain that produced this release
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"

      - run: pnpm install --frozen-lockfile

      # The gate. A tag is not a reason to publish something that does not build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check the tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION." >&2
            echo "Publishing a version that disagrees with its tag makes the history unreadable." >&2
            exit 1
          fi
          echo "tag and version agree on $VERSION"

      - name: Verify the tarball installs and runs
        working-directory: packages/cli
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y > /dev/null
          npm install --silent /tmp/nextship-*.tgz
          # Proves the adapter resolves from the packed tree rather than from the
          # workspace, which is the defect this check exists to catch.
          node -e "
            const path = require('node:path')
            const fs = require('node:fs')
            const adapter = path.join('node_modules', 'nextship', 'runtime', 'adapter.mjs')
            if (!fs.existsSync(adapter)) { console.error('adapter missing from the published package'); process.exit(1) }
            console.log('installed package carries its adapter')
          "
          # Invoke the installed binary, not dist/index.js. npm silently drops a
          # malformed bin entry at publish time, and a check that runs the file
          # directly passes while the published package has no command at all.
          ./node_modules/.bin/nextship --version
          node -e "
            const pkg = require('./node_modules/nextship/package.json')
            const bin = pkg.bin && pkg.bin.nextship
            if (!bin) { console.error('the published package declares no nextship binary'); process.exit(1) }
            console.log('binary declared as', bin)
          "

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dryRun == false }}
        working-directory: packages/cli
        # --provenance signs a statement linking these bytes to this commit.
        # Under a trusted publisher it is implied, but passing it explicitly means
        # the token phase produces an attested package too, rather than the first
        # published version being the one nobody can verify.
        run: npm publish --provenance --access public
        env:
          # Empty once NPM_TOKEN is deleted, at which point npm uses the OIDC
          # token instead. Both paths are authenticated; only one leaves a
          # long-lived credential lying around.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: echo "Packed and verified. Nothing was published, because this was a dry run."
