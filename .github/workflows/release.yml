# Stages nextship-cli on npm with provenance, for a maintainer to approve.
#
# Releases are built here rather than on a laptop so npm can attest where the
# tarball came from. Provenance signs a statement linking the published bytes to
# this repository, this workflow and the exact commit, which anyone can verify on
# the package page.
#
# That matters more for this package than for most. nextship asks people for a
# cloud token and builds their source, so "the code you audited is the code you
# installed" is a claim worth being able to prove rather than assert.
#
# Authentication is npm trusted publishing, and releases are staged. npm accepts a
# staged publish from this workflow file in this repository, exchanging the job's
# short-lived OIDC token for a token that can only stage. A staged version goes
# live when a maintainer approves it with 2FA, from the CLI or the package page,
# and approval requires interactive authentication that no workflow can supply.
# This job can stage a release but cannot ship one, and neither can anyone who
# compromises it. No long-lived npm credential exists anywhere.
#
# The trusted publisher is configured on npmjs.com in the package's settings: this
# repository, the filename release.yml, and npm stage publish as its only allowed
# action. Renaming this file breaks releases until that configuration is recreated
# with the new name.
#
# Author: Gowtham
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Pack and verify without staging'
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token this grants is both the staging credential, through the
      # trusted publisher, and the signature behind the provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No registry-url. With it, setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with no
      # token that empty line tells npm authentication is already configured, so it
      # never attempts the OIDC exchange and staging fails with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node 22 ships npm 10, which supports neither OIDC nor staging. Trusted
      # publishing needs npm 11.5.1 or newer, and staged publishing 11.15.0.
      - run: npm i -g npm@latest corepack@latest && corepack enable

      - name: Record the toolchain that produced this release
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"

      - run: pnpm install --frozen-lockfile

      # The gate. A tag is not a reason to stage something that does not build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check the tag matches the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION." >&2
            echo "Releasing a version that disagrees with its tag makes the history unreadable." >&2
            exit 1
          fi
          echo "tag and version agree on $VERSION"

      - name: Verify the tarball installs and runs
        working-directory: packages/cli
        run: |
          NAME="$(node -p "require('./package.json').name")"
          npm pack --pack-destination /tmp
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y > /dev/null
          npm install --silent /tmp/"$NAME"-*.tgz

          # Every path below is derived from the manifest. Writing the package name
          # out by hand is how the previous attempt failed: a rename updated some of
          # these checks and not others, and the ones left behind looked for a
          # directory that no longer existed.

          # The adapter must resolve from the packed tree rather than the workspace,
          # and README, LICENSE and NOTICE must travel with it: npm publishes the
          # package directory, and Apache-2.0 requires the last two to go with the work.
          node -e "
            const fs = require('node:fs')
            const path = require('node:path')
            const dir = path.join('node_modules', process.argv[1])
            const required = ['runtime/adapter.mjs', 'README.md', 'LICENSE', 'NOTICE']
            const missing = required.filter((file) => !fs.existsSync(path.join(dir, file)))
            if (missing.length > 0) { console.error('missing from the published package: ' + missing.join(', ')); process.exit(1) }
            console.log('installed package carries ' + required.join(', '))
          " "$NAME"

          # Run the installed binary, not dist/index.js. npm drops a malformed bin
          # entry at publish time with only a warning, so a check that runs the file
          # directly passes while the published package has no command at all.
          ./node_modules/.bin/nextship --version
          node -e "
            const pkg = require('./node_modules/' + process.argv[1] + '/package.json')
            if (!pkg.bin || !pkg.bin.nextship) { console.error('the published package declares no nextship binary'); process.exit(1) }
            console.log('binary declared as', pkg.bin.nextship)
          " "$NAME"

      - name: Stage the release
        if: ${{ github.event_name == 'push' || inputs.dryRun == false }}
        working-directory: packages/cli
        # Stages rather than publishes; see the header. The version goes live only
        # when a maintainer approves it with 2FA. Provenance is generated for staged
        # versions exactly as for direct publishes.
        run: npm stage publish --provenance --access public

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: echo "Packed and verified. Nothing was staged, because this was a dry run."
